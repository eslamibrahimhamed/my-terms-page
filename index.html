<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>My Terms</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #667085;
    --line: #e3e6ea; --accent: #2f6fde; --code: #f1f3f6; --danger: #c4372d;
    --accent-sub: #0f8a6c; --note: #a8650a; --accent-sec: #7b4bd1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --card: #1d2026; --text: #e7e9ee; --muted: #9aa3b2;
      --line: #2c3038; --accent: #6c9cf0; --code: #262a31; --danger: #ef6b61;
      --accent-sub: #2f9e7c; --note: #e3b341; --accent-sec: #8a63d2;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 "Segoe UI", Tahoma, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub, .status { color: var(--muted); margin: 0 0 16px; font-size: 14px; min-height: 1.6em; }
  form, .term { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  input, textarea { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  textarea { min-height: 70px; resize: vertical; }
  .ltr { direction: ltr; text-align: left; }
  .mono, pre { font-family: Consolas, "Courier New", monospace; font-size: 14px; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .row .close { margin-inline-start: auto; color: var(--muted); }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 24px 0 12px; }
  .tools input { flex: 1; min-width: 180px; }
  .term { margin-bottom: 12px; }
  .term h2 { font-size: 18px; margin: 0; text-align: right; }
  .term summary { cursor: pointer; list-style: none; }
  .term summary::-webkit-details-marker { display: none; }
  .term h2::before { content: '▸ '; color: var(--muted); }
  .term[open] h2::before { content: '▾ '; }
  .term p { margin: 6px 0 0; white-space: pre-wrap; }
  pre { background: var(--code); padding: 10px; border-radius: 8px; margin: 8px 0 0; white-space: pre-wrap; direction: ltr; text-align: left; }
  .code { position: relative; margin: 8px 0 0; }
  .code pre { margin: 0; padding-right: 46px; }
  .copy { position: absolute; top: 6px; right: 6px; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; color: var(--muted); }
  .copy:hover { color: var(--text); }
  .copy.done { color: var(--accent-sub); border-color: var(--accent-sub); }
  .copy svg, .arrow svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .empty { color: var(--muted); text-align: center; padding: 32px 0; }
  .count { color: var(--muted); font-size: 14px; }
  .scroller { display: flex; align-items: center; gap: 4px; margin: 0 0 12px; }
  .chips { display: flex; gap: 6px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .arrow { display: none; flex: none; place-items: center; width: 30px; height: 30px; padding: 0; border-radius: 999px; color: var(--muted); }
  .arrow:hover { color: var(--text); }
  .scroller.overflow .arrow { display: grid; }
  .scroller[hidden] { display: none; }
  .chip { flex: none; white-space: nowrap; padding: 4px 12px; border-radius: 999px; font-size: 14px; }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #sections .chip.active { background: var(--accent-sec); border-color: var(--accent-sec); }
  #subchips .chip.active { background: var(--accent-sub); border-color: var(--accent-sub); }
  .interview { margin-top: 12px; padding: 4px 12px 12px; border: 1px solid var(--accent-sub); border-radius: 8px; }
  .interview-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
  .interview h3 { margin: 0; font-size: 15px; color: var(--accent-sub); }
  .interview .q { font-weight: 600; margin-top: 14px; }
  .interview .why strong { color: var(--accent-sub); }
  .interview .note { border-inline-start: 3px solid var(--note); padding-inline-start: 8px; }
  .interview .note strong { color: var(--note); }
  .term p code { font-family: Consolas, "Courier New", monospace; font-size: 14px; background: var(--code); padding: 0 4px; border-radius: 4px; }
  #form { margin-top: 12px; }
  .tag { display: inline-block; font-size: 12px; font-weight: normal; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; margin-inline-start: 8px; vertical-align: middle; }
</style>
</head>
<body>
<main>
  <h1>My Terms</h1>
  <p class="status" id="status"></p>

  <form id="setup" hidden>
    <label for="token">GitHub token</label>
    <input id="token" class="ltr mono" type="password" required autocomplete="off">
    <p class="sub">التوكن بيتحفظ في البراوزر ده بس، ومحتاجه مرة واحدة على كل جهاز.</p>
    <button type="submit" class="primary">دخول</button>
  </form>

  <div id="app" hidden>
    <button type="button" class="primary" id="toggleForm">إضافة مصطلح</button>
    <form id="form" hidden>
      <label for="term">المصطلح</label>
      <input id="term" class="ltr" required autocomplete="off" placeholder="closure">
      <label for="category">القسم</label>
      <input id="category" class="ltr" list="categories" required autocomplete="off" placeholder="JS">
      <datalist id="categories"></datalist>
      <label for="section">مجموعة (اختياري)</label>
      <input id="section" class="ltr" list="section-list" autocomplete="off" placeholder="The Frontend AI Toolchain">
      <datalist id="section-list"></datalist>
      <label for="subcategory">قسم فرعي (اختياري)</label>
      <input id="subcategory" class="ltr" list="subcategories" autocomplete="off" placeholder="Fundamentals">
      <datalist id="subcategories"></datalist>
      <label for="meaning">شرحه بكلامي</label>
      <textarea id="meaning" dir="auto" required></textarea>
      <label for="code">سطر كود (اختياري)</label>
      <textarea id="code" class="ltr mono"></textarea>
      <label for="interview">أسئلة الإنترفيو (اختياري)</label>
      <textarea id="interview" class="ltr mono" rows="7" placeholder="Q: What is typeof NaN?&#10;س: الـ typeof بتاعة NaN بترجّع إيه؟&#10;A: بترجّع number.&#10;ليه: الـ NaN نتيجة حسابية بايظة، بس لسه نوعها number.&#10;typeof NaN   // 'number'&#10;&#10;Q: next question..."></textarea>
      <div class="row">
        <button type="submit" class="primary" id="submit">إضافة</button>
        <button type="button" id="cancel" hidden>إلغاء التعديل</button>
      </div>
    </form>

    <div class="tools">
      <input id="search" type="search" placeholder="بحث...">
      <span class="count" id="count"></span>
    </div>

    <div class="chips" id="chips"></div>
    <div class="chips" id="sections"></div>
    <div class="chips" id="subchips"></div>
    <div id="list"></div>
  </div>
</main>

<script>
  // Pages URL is <owner>.github.io, terms live in the private <owner>/my-terms repo
  const OWNER = location.hostname.split('.')[0];
  const API = `https://api.github.com/repos/${OWNER}/my-terms/contents/terms.json`;
  const TOKEN_KEY = 'my-terms-token';
  const $ = (id) => document.getElementById(id);
  let token = readToken();
  let terms = [];
  let editingId = null;
  let activeCategory = '';
  let activeSection = '';
  let activeSub = '';

  function readToken() {
    try { return localStorage.getItem(TOKEN_KEY); } catch { return null; }
  }

  function writeToken(value) {
    try { value ? localStorage.setItem(TOKEN_KEY, value) : localStorage.removeItem(TOKEN_KEY); } catch {}
  }

  function toBase64(text) {
    let bin = '';
    for (const b of new TextEncoder().encode(text)) bin += String.fromCharCode(b);
    return btoa(bin);
  }

  const fromBase64 = (b64) => new TextDecoder().decode(Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)));
  const sameTerm = (a, b) => a.trim().toLowerCase() === b.trim().toLowerCase();

  // Textarea format per question: "Q: english", optional "س: عربي", "A: answer", optional "ليه: reason" and "ملاحظة: quiz feedback", then optional code lines
  function parseInterview(text) {
    return text.split(/^(?=Q:)/m).map((b) => b.trim()).filter((b) => b.startsWith('Q:')).map((block) => {
      const [qLine, ...rest] = block.split('\n');
      const header = {};
      let i = 0;
      for (let m; i < rest.length && (m = rest[i].match(/^(س|A|ليه|ملاحظة):(.*)$/)); i++) header[m[1]] = m[2].trim();
      const item = {
        q: qLine.slice(2).trim(),
        ...(header['س'] ? { qAr: header['س'] } : {}),
        a: header.A || '',
        ...(header['ليه'] ? { why: header['ليه'] } : {}),
        ...(header['ملاحظة'] ? { feedback: header['ملاحظة'] } : {}),
      };
      const code = rest.slice(i).join('\n').replace(/^\n+/, '').trimEnd();
      return code ? { ...item, code } : item;
    });
  }

  const formatInterview = (items = []) =>
    items
      .map((i) => [`Q: ${i.q}`, i.qAr && `س: ${i.qAr}`, `A: ${i.a}`, i.why && `ليه: ${i.why}`, i.feedback && `ملاحظة: ${i.feedback}`, i.code].filter(Boolean).join('\n'))
      .join('\n\n');

  async function gh(method, body) {
    const res = await fetch(API, {
      method,
      cache: 'no-store',
      headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' },
      body: body && JSON.stringify(body),
    });
    if (res.status === 401) {
      logout();
      throw new Error('التوكن مش صالح أو انتهى، حط توكن جديد.');
    }
    return res;
  }

  async function fetchFile() {
    const res = await gh('GET');
    if (res.status === 404) return { list: [], sha: undefined };
    if (!res.ok) throw new Error(`GitHub رجّع ${res.status}.`);
    const file = await res.json();
    return { list: JSON.parse(fromBase64(file.content)), sha: file.sha };
  }

  // Re-reads the file before each save so edits made elsewhere are kept
  async function commit(message, change) {
    setBusy(true, 'بيحفظ...');
    try {
      const { list, sha } = await fetchFile();
      const next = change(list);
      const res = await gh('PUT', { message, content: toBase64(JSON.stringify(next, null, 2) + '\n'), sha });
      if (res.status === 404) throw new Error('الريبو my-terms مش موجود أو التوكن مالوش صلاحية عليه.');
      if (res.status === 409) throw new Error('الملف اتعدّل من مكان تاني في نفس اللحظة، جرّب تاني.');
      if (!res.ok) throw new Error(`GitHub رجّع ${res.status}، ومحصلش حفظ.`);
      terms = next;
      render();
      return true;
    } catch (e) {
      alert(e.message);
      return false;
    } finally {
      setBusy(false);
    }
  }

  function setBusy(on, text) {
    document.querySelectorAll('#app button').forEach((b) => (b.disabled = on));
    $('status').textContent = on ? text : '';
  }

  function el(tag, props = {}, text = '') {
    const node = Object.assign(document.createElement(tag), props);
    if (text) node.textContent = text;
    return node;
  }

  const svg = (inner) => `<svg viewBox="0 0 24 24" aria-hidden="true">${inner}</svg>`;
  const ICON_COPY = svg('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>');
  const ICON_DONE = svg('<path d="M20 6 9 17l-5-5"/>');

  // A code block with a copy button in its corner
  function codeBlock(text) {
    const pre = el('pre', {}, text);
    const btn = el('button', { type: 'button', className: 'copy', title: 'نسخ', innerHTML: ICON_COPY });
    btn.setAttribute('aria-label', 'نسخ');
    btn.onclick = async () => {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        getSelection().selectAllChildren(pre); // clipboard blocked: select it so Ctrl+C works
        return;
      }
      btn.innerHTML = ICON_DONE;
      btn.title = 'اتنسخ';
      btn.classList.add('done');
      setTimeout(() => {
        btn.innerHTML = ICON_COPY;
        btn.title = 'نسخ';
        btn.classList.remove('done');
      }, 1500);
    };
    const wrap = el('div', { className: 'code' });
    wrap.append(pre, btn);
    return wrap;
  }

  // A chip row stays on one line and scrolls sideways with arrows instead of wrapping.
  // Returns update(), which shows the arrows only when the row overflows, each one until its own end
  function scroller(row) {
    const arrow = (dir, path, label) => {
      const b = el('button', { type: 'button', className: 'arrow', innerHTML: svg(`<path d="${path}"/>`) });
      b.setAttribute('aria-label', label);
      b.onclick = () => row.scrollBy({ left: dir * row.clientWidth * 0.7, behavior: 'smooth' });
      return b;
    };
    const left = arrow(-1, 'M15 6l-6 6 6 6', 'شمال');
    const right = arrow(1, 'M9 6l6 6-6 6', 'يمين');
    const wrap = el('div', { className: 'scroller' });
    row.replaceWith(wrap);
    wrap.append(right, row, left); // the page is RTL, so the first child sits on the right
    // Compares against the whole width (arrows included) without hiding the arrows, so the scroll position never gets clamped
    const update = () => {
      wrap.classList.toggle('overflow', row.scrollWidth > wrap.clientWidth + 1);
      const r = row.getBoundingClientRect();
      const kids = [...row.children].map((k) => k.getBoundingClientRect());
      left.style.visibility = kids.some((k) => k.left < r.left - 1) ? 'visible' : 'hidden';
      right.style.visibility = kids.some((k) => k.right > r.right + 1) ? 'visible' : 'hidden';
    };
    row.addEventListener('scroll', update, { passive: true });
    addEventListener('resize', update);
    return update;
  }

  // After a row is rebuilt: keep its scroll position and bring the active chip into view
  function settle(row, keep, update) {
    update();
    row.scrollLeft = keep;
    const active = row.querySelector('.active');
    if (active) {
      const r = row.getBoundingClientRect();
      const c = active.getBoundingClientRect();
      if (c.left < r.left) row.scrollLeft -= r.left - c.left + 8;
      else if (c.right > r.right) row.scrollLeft += c.right - r.right + 8;
    }
    update();
  }

  // Subcategories keep the order they were first added, so course lessons stay in lesson order;
  // side tabs (Operators, a course's Prompt tab) always come last, in this order.
  // sec limits them to one section ('' = no section); undefined = the whole category
  const LAST_TABS = ['Operators', 'Prompt'];
  const inSection = (t, sec) => sec === undefined || (t.section || '') === sec;
  const subsOf = (c, sec) => {
    const subs = [...new Set(terms.filter((t) => t.subcategory && sameTerm(t.category || '', c) && inSection(t, sec)).sort((a, b) => a.id - b.id).map((t) => t.subcategory))];
    const rank = (s) => LAST_TABS.findIndex((name) => sameTerm(s, name));
    return [...subs.filter((s) => rank(s) < 0), ...LAST_TABS.flatMap((name) => subs.filter((s) => sameTerm(s, name)))];
  };

  // Sections group a category's subcategories (a course's parts, each with its lessons), in the order they were first added
  const sectionsOf = (c) => [...new Set(terms.filter((t) => t.section && sameTerm(t.category || '', c)).sort((a, b) => a.id - b.id).map((t) => t.section))];

  function fillLists() {
    const c = $('category').value;
    $('section-list').replaceChildren(...sectionsOf(c).map((s) => el('option', { value: s })));
    $('subcategories').replaceChildren(...subsOf(c, $('section').value.trim() || undefined).map((s) => el('option', { value: s })));
  }

  // Returns the section options of the active category ('' = terms with no section, "عام"); empty when it has no sections
  function renderSectionChips() {
    const box = $('sections');
    const keep = box.scrollLeft;
    box.replaceChildren();
    const inCategory = terms.filter((t) => t.category === activeCategory);
    const secs = sectionsOf(activeCategory);
    const options = secs.length && inCategory.some((t) => !t.section) ? [...secs, ''] : secs;
    if (!options.includes(activeSection)) activeSection = options[0] ?? '';
    box.parentElement.hidden = !options.length;
    for (const s of options) {
      // A section counts its lessons, otherwise its terms
      const count = subsOf(activeCategory, s).length || inCategory.filter((t) => (t.section || '') === s).length;
      const chip = el('button', { type: 'button', dir: 'auto', className: 'chip' + (s === activeSection ? ' active' : '') }, `${s || 'عام'} (${count})`);
      chip.onclick = () => {
        activeSection = s;
        activeSub = '';
        if (!editingId) $('section').value = s;
        render();
        if (!editingId) $('subcategory').value = activeSub;
      };
      box.append(chip);
    }
    settle(box, keep, fitSections);
    return options;
  }

  // Returns the sub options of the active category, inside the active section when it has sections; '' = terms with no subcategory ("عام")
  function renderSubChips(sec) {
    const box = $('subchips');
    const keep = box.scrollLeft;
    box.replaceChildren();
    const inCategory = terms.filter((t) => t.category === activeCategory && inSection(t, sec));
    const subs = subsOf(activeCategory, sec);
    const options = subs.length && inCategory.some((t) => !t.subcategory) ? [...subs, ''] : subs;
    if (!options.includes(activeSub)) activeSub = options[0] ?? '';
    for (const s of options) {
      const count = inCategory.filter((t) => (t.subcategory || '') === s).length;
      const chip = el('button', { type: 'button', dir: 'auto', className: 'chip' + (s === activeSub ? ' active' : '') }, `${s || 'عام'} (${count})`);
      chip.onclick = () => {
        activeSub = s;
        if (!editingId) $('subcategory').value = s;
        render();
      };
      box.append(chip);
    }
    settle(box, keep, fitSubs);
    return options;
  }

  // Text between `backticks` becomes LTR inline code, so code inside Arabic sentences keeps its order
  const richParts = (text = '') => text.split('`').map((part, i) => (i % 2 ? el('code', { dir: 'ltr' }, part) : part));

  function rich(tag, props, text) {
    const node = el(tag, props);
    node.append(...richParts(text));
    return node;
  }

  // A quiz note line: colored label + rich text
  function labeled(label, text) {
    const p = rich('p', { dir: 'auto', className: 'note' }, text);
    p.prepend(el('strong', {}, label));
    return p;
  }

  function renderChips(categories) {
    const chips = $('chips');
    const keep = chips.scrollLeft;
    chips.replaceChildren();
    for (const c of categories) {
      // A category counts its sections, else its subcategories, else its terms
      const count = sectionsOf(c).length || subsOf(c).length || terms.filter((t) => t.category === c).length;
      const chip = el('button', { type: 'button', dir: 'auto', className: 'chip' + (c === activeCategory ? ' active' : '') }, `${c} (${count})`);
      chip.onclick = () => {
        activeCategory = c;
        activeSection = '';
        activeSub = '';
        if (!editingId) $('category').value = c;
        render();
        if (!editingId) {
          $('section').value = activeSection;
          $('subcategory').value = activeSub;
        }
      };
      chips.append(chip);
    }
    settle(chips, keep, fitChips);
  }

  function render() {
    const categories = [...new Set(terms.map((t) => t.category).filter(Boolean))].sort((a, b) => a.localeCompare(b));
    if (!categories.includes(activeCategory)) activeCategory = categories[0] ?? '';
    $('categories').replaceChildren(...categories.map((c) => el('option', { value: c })));
    renderChips(categories);
    const sec = renderSectionChips().length ? activeSection : undefined;
    const subOptions = renderSubChips(sec);
    fillLists();

    // A search looks through every category, the chips filter only when the search is empty
    const q = $('search').value.trim().toLowerCase();
    const shown = terms
      .filter((t) => q || !activeCategory || t.category === activeCategory)
      .filter((t) => q || inSection(t, sec))
      .filter((t) => q || !subOptions.length || (t.subcategory || '') === activeSub)
      .filter((t) => !q || [t.term, t.category, t.section, t.subcategory, t.meaning, ...(t.interview || []).flatMap((i) => [i.q, i.qAr, i.a, i.why, i.feedback])].join(' ').toLowerCase().includes(q))
      .sort((a, b) => a.id - b.id);

    $('count').textContent = terms.length ? `${terms.length} مصطلح` : '';
    const list = $('list');
    list.replaceChildren();

    if (!shown.length) {
      list.append(el('p', { className: 'empty' }, terms.length ? 'مفيش نتايج.' : 'لسه مفيش مصطلحات، ضيف أول واحد.'));
      return;
    }

    for (const t of shown) {
      const card = el('details', { className: 'term' });
      // "english — عربي": the Arabic half gets its own RTL direction, so "بالـ AI" keeps its word order
      const cut = t.term.indexOf(' — ');
      const title = el('h2', { dir: 'ltr' }, cut < 0 ? t.term : t.term.slice(0, cut + 3));
      if (cut >= 0) title.append(el('bdi', { dir: 'rtl' }, t.term.slice(cut + 3)));
      if (t.category) title.append(el('span', { className: 'tag' }, t.subcategory ? `${t.category} › ${t.subcategory}` : t.category));
      const summary = el('summary');
      summary.append(title);
      card.append(summary, rich('p', { dir: 'auto' }, t.meaning));
      if (t.code) card.append(codeBlock(t.code));
      if (t.interview?.length) {
        const box = el('section', { className: 'interview' });
        const head = el('div', { className: 'interview-head' });
        head.append(el('h3', {}, 'أسئلة الإنترفيو'));
        box.append(head);
        if (t.quizNote) box.append(labeled('آخر اختبار: ', t.quizNote));
        const questions = [];
        for (const item of t.interview) {
          const q = rich('p', { className: 'q', dir: 'auto' }, item.qAr || item.q);
          questions.push([q, item]);
          box.append(q, rich('p', { dir: 'auto' }, item.a));
          if (item.why) {
            const why = rich('p', { dir: 'auto', className: 'why' }, item.why);
            why.prepend(el('strong', {}, 'ليه؟ '));
            box.append(why);
          }
          if (item.feedback) box.append(labeled('ملاحظتي على إجابتك: ', item.feedback));
          if (item.code) box.append(codeBlock(item.code));
        }
        // Swaps the questions between English and Arabic without re-rendering (keeps the card open)
        if (t.interview.some((i) => i.qAr)) {
          let arabic = true;
          const toggle = el('button', { type: 'button', className: 'chip' }, 'English');
          toggle.onclick = () => {
            arabic = !arabic;
            toggle.textContent = arabic ? 'English' : 'عربي';
            for (const [p, item] of questions) p.replaceChildren(...richParts(arabic ? item.qAr || item.q : item.q));
          };
          head.append(toggle);
        }
        card.append(box);
      }
      const edit = el('button', { type: 'button' }, 'تعديل');
      const del = el('button', { type: 'button', className: 'danger' }, 'حذف');
      edit.onclick = () => startEdit(t);
      del.onclick = () => confirm(`تحذف "${t.term}"؟`) && commit(`delete: ${t.term}`, (all) => all.filter((x) => x.id !== t.id));
      const close = el('button', { type: 'button', className: 'close' }, 'قفل ▴');
      close.onclick = () => {
        card.open = false;
        summary.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      };
      const actions = el('div', { className: 'row' });
      actions.append(edit, del, close);
      card.append(actions);
      list.append(card);
    }
  }

  function startEdit(t) {
    editingId = t.id;
    $('term').value = t.term;
    $('category').value = t.category || '';
    $('section').value = t.section || '';
    $('subcategory').value = t.subcategory || '';
    fillLists();
    $('meaning').value = t.meaning;
    $('code').value = t.code || '';
    $('interview').value = formatInterview(t.interview);
    $('submit').textContent = 'حفظ التعديل';
    $('cancel').hidden = false;
    showForm(true);
    window.scrollTo({ top: 0, behavior: 'smooth' });
    $('term').focus();
  }

  function resetForm() {
    editingId = null;
    $('form').reset();
    $('submit').textContent = 'إضافة';
    $('cancel').hidden = true;
    showForm(false);
  }

  // The form stays hidden until the toggle button or an edit opens it
  function showForm(open) {
    $('form').hidden = !open;
    $('toggleForm').textContent = open ? 'قفل الفورم' : 'إضافة مصطلح';
  }

  async function load() {
    $('setup').hidden = true;
    $('app').hidden = false;
    setBusy(true, 'بيحمّل...');
    try {
      terms = (await fetchFile()).list;
      render();
    } catch (e) {
      alert(e.message);
    } finally {
      setBusy(false);
    }
  }

  function logout() {
    token = null;
    writeToken(null);
    terms = [];
    resetForm();
    $('app').hidden = true;
    $('setup').hidden = false;
  }

  $('setup').onsubmit = (e) => {
    e.preventDefault();
    token = $('token').value.trim();
    $('token').value = '';
    writeToken(token);
    load();
  };

  $('form').onsubmit = async (e) => {
    e.preventDefault();
    const entry = {
      term: $('term').value.trim(),
      category: $('category').value.trim(),
      section: $('section').value.trim(),
      subcategory: $('subcategory').value.trim(),
      meaning: $('meaning').value.trim(),
      code: $('code').value.trim(),
      interview: parseInterview($('interview').value),
    };
    if (!entry.term || !entry.category || !entry.meaning) return;
    const id = editingId;
    const saved = await commit(`${id ? 'edit' : 'add'}: ${entry.term}`, (all) => {
      if (all.some((t) => t.id !== id && sameTerm(t.term, entry.term))) {
        throw new Error('المصطلح ده موجود بالفعل، عدّله من القايمة.');
      }
      // Reuse an existing category's spelling so "js" and "JS" stay one chip
      entry.category = all.map((t) => t.category).find((c) => c && sameTerm(c, entry.category)) || entry.category;
      const inCategory = all.filter((t) => t.category === entry.category);
      entry.section = inCategory.map((t) => t.section).find((s) => s && sameTerm(s, entry.section)) || entry.section;
      entry.subcategory = inCategory.map((t) => t.subcategory).find((s) => s && sameTerm(s, entry.subcategory)) || entry.subcategory;
      // A lesson already filed under a section keeps it when the field is left empty
      if (!entry.section && entry.subcategory) entry.section = inCategory.find((t) => t.section && t.subcategory === entry.subcategory)?.section || '';
      // Drop empty optional fields (no subcategory = single-level category)
      const clean = ({ section, subcategory, interview, ...rest }) => ({
        ...rest,
        ...(section ? { section } : {}),
        ...(subcategory ? { subcategory } : {}),
        ...(interview.length ? { interview } : {}),
      });
      return id ? all.map((t) => (t.id === id ? clean({ ...t, ...entry }) : t)) : [...all, clean({ id: Date.now(), ...entry })];
    });
    if (!saved) return;
    activeCategory = entry.category;
    activeSection = entry.section;
    activeSub = entry.subcategory;
    resetForm();
    render();
  };

  const fitChips = scroller($('chips'));
  const fitSections = scroller($('sections'));
  const fitSubs = scroller($('subchips'));

  $('toggleForm').onclick = () => showForm($('form').hidden);
  $('cancel').onclick = resetForm;
  $('search').oninput = render;
  $('category').oninput = fillLists;
  $('section').oninput = fillLists;

  if (token) load();
  else $('setup').hidden = false;
</script>
</body>
</html>
