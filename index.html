<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>My Terms</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #667085;
    --line: #e3e6ea; --accent: #2f6fde; --code: #f1f3f6; --danger: #c4372d;
    --accent-sub: #0f8a6c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --card: #1d2026; --text: #e7e9ee; --muted: #9aa3b2;
      --line: #2c3038; --accent: #6c9cf0; --code: #262a31; --danger: #ef6b61;
      --accent-sub: #2f9e7c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 "Segoe UI", Tahoma, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub, .status { color: var(--muted); margin: 0 0 16px; font-size: 14px; min-height: 1.6em; }
  form, .term { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  input, textarea { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  textarea { min-height: 70px; resize: vertical; }
  .ltr { direction: ltr; text-align: left; }
  .mono, pre { font-family: Consolas, "Courier New", monospace; font-size: 14px; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 24px 0 12px; }
  .tools input { flex: 1; min-width: 180px; }
  .term { margin-bottom: 12px; }
  .term h2 { font-size: 18px; margin: 0; text-align: right; }
  .term summary { cursor: pointer; list-style: none; }
  .term summary::-webkit-details-marker { display: none; }
  .term h2::before { content: '▸ '; color: var(--muted); }
  .term[open] h2::before { content: '▾ '; }
  .term p { margin: 6px 0 0; white-space: pre-wrap; }
  pre { background: var(--code); padding: 10px; border-radius: 8px; margin: 8px 0 0; white-space: pre-wrap; direction: ltr; text-align: left; }
  .empty { color: var(--muted); text-align: center; padding: 32px 0; }
  .count { color: var(--muted); font-size: 14px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
  .chip { padding: 4px 12px; border-radius: 999px; font-size: 14px; }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #subchips .chip.active { background: var(--accent-sub); border-color: var(--accent-sub); }
  .interview { margin-top: 12px; padding: 4px 12px 12px; border: 1px solid var(--accent-sub); border-radius: 8px; }
  .interview-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
  .interview h3 { margin: 0; font-size: 15px; color: var(--accent-sub); }
  .interview .q { font-weight: 600; margin-top: 14px; }
  .tag { display: inline-block; font-size: 12px; font-weight: normal; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; margin-inline-start: 8px; vertical-align: middle; }
</style>
</head>
<body>
<main>
  <h1>My Terms</h1>
  <p class="status" id="status"></p>

  <form id="setup" hidden>
    <label for="token">GitHub token</label>
    <input id="token" class="ltr mono" type="password" required autocomplete="off">
    <p class="sub">التوكن بيتحفظ في البراوزر ده بس، ومحتاجه مرة واحدة على كل جهاز.</p>
    <button type="submit" class="primary">دخول</button>
  </form>

  <div id="app" hidden>
    <form id="form">
      <label for="term">المصطلح</label>
      <input id="term" class="ltr" required autocomplete="off" placeholder="closure">
      <label for="category">القسم</label>
      <input id="category" class="ltr" list="categories" required autocomplete="off" placeholder="JS">
      <datalist id="categories"></datalist>
      <label for="subcategory">قسم فرعي (اختياري)</label>
      <input id="subcategory" class="ltr" list="subcategories" autocomplete="off" placeholder="Fundamentals">
      <datalist id="subcategories"></datalist>
      <label for="meaning">شرحه بكلامي</label>
      <textarea id="meaning" dir="auto" required></textarea>
      <label for="code">سطر كود (اختياري)</label>
      <textarea id="code" class="ltr mono"></textarea>
      <label for="interview">أسئلة الإنترفيو (اختياري)</label>
      <textarea id="interview" class="ltr mono" rows="7" placeholder="Q: What is typeof NaN?&#10;س: الـ typeof بتاعة NaN بترجّع إيه؟&#10;A: بترجّع number، لأن NaN رقم غلط بس لسه number.&#10;typeof NaN   // 'number'&#10;&#10;Q: next question..."></textarea>
      <div class="row">
        <button type="submit" class="primary" id="submit">إضافة</button>
        <button type="button" id="cancel" hidden>إلغاء التعديل</button>
      </div>
    </form>

    <div class="tools">
      <input id="search" type="search" placeholder="بحث...">
      <span class="count" id="count"></span>
    </div>

    <div class="chips" id="chips"></div>
    <div class="chips" id="subchips"></div>
    <div id="list"></div>
  </div>
</main>

<script>
  // Pages URL is <owner>.github.io, terms live in the private <owner>/my-terms repo
  const OWNER = location.hostname.split('.')[0];
  const API = `https://api.github.com/repos/${OWNER}/my-terms/contents/terms.json`;
  const TOKEN_KEY = 'my-terms-token';
  const $ = (id) => document.getElementById(id);
  let token = readToken();
  let terms = [];
  let editingId = null;
  let activeCategory = '';
  let activeSub = '';

  function readToken() {
    try { return localStorage.getItem(TOKEN_KEY); } catch { return null; }
  }

  function writeToken(value) {
    try { value ? localStorage.setItem(TOKEN_KEY, value) : localStorage.removeItem(TOKEN_KEY); } catch {}
  }

  function toBase64(text) {
    let bin = '';
    for (const b of new TextEncoder().encode(text)) bin += String.fromCharCode(b);
    return btoa(bin);
  }

  const fromBase64 = (b64) => new TextDecoder().decode(Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)));
  const sameTerm = (a, b) => a.trim().toLowerCase() === b.trim().toLowerCase();

  // Textarea format per question: "Q: english", optional "س: عربي", "A: answer", then optional code lines
  function parseInterview(text) {
    return text.split(/^(?=Q:)/m).map((b) => b.trim()).filter((b) => b.startsWith('Q:')).map((block) => {
      const [qLine, ...rest] = block.split('\n');
      const header = {};
      let i = 0;
      for (; i < rest.length && /^(س|A):/.test(rest[i]); i++) header[rest[i][0]] = rest[i].slice(2).trim();
      const item = { q: qLine.slice(2).trim(), ...(header['س'] ? { qAr: header['س'] } : {}), a: header.A || '' };
      const code = rest.slice(i).join('\n').replace(/^\n+/, '').trimEnd();
      return code ? { ...item, code } : item;
    });
  }

  const formatInterview = (items = []) =>
    items.map((i) => [`Q: ${i.q}`, i.qAr && `س: ${i.qAr}`, `A: ${i.a}`, i.code].filter(Boolean).join('\n')).join('\n\n');

  async function gh(method, body) {
    const res = await fetch(API, {
      method,
      cache: 'no-store',
      headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' },
      body: body && JSON.stringify(body),
    });
    if (res.status === 401) {
      logout();
      throw new Error('التوكن مش صالح أو انتهى، حط توكن جديد.');
    }
    return res;
  }

  async function fetchFile() {
    const res = await gh('GET');
    if (res.status === 404) return { list: [], sha: undefined };
    if (!res.ok) throw new Error(`GitHub رجّع ${res.status}.`);
    const file = await res.json();
    return { list: JSON.parse(fromBase64(file.content)), sha: file.sha };
  }

  // Re-reads the file before each save so edits made elsewhere are kept
  async function commit(message, change) {
    setBusy(true, 'بيحفظ...');
    try {
      const { list, sha } = await fetchFile();
      const next = change(list);
      const res = await gh('PUT', { message, content: toBase64(JSON.stringify(next, null, 2) + '\n'), sha });
      if (res.status === 404) throw new Error('الريبو my-terms مش موجود أو التوكن مالوش صلاحية عليه.');
      if (res.status === 409) throw new Error('الملف اتعدّل من مكان تاني في نفس اللحظة، جرّب تاني.');
      if (!res.ok) throw new Error(`GitHub رجّع ${res.status}، ومحصلش حفظ.`);
      terms = next;
      render();
      return true;
    } catch (e) {
      alert(e.message);
      return false;
    } finally {
      setBusy(false);
    }
  }

  function setBusy(on, text) {
    document.querySelectorAll('#app button').forEach((b) => (b.disabled = on));
    $('status').textContent = on ? text : '';
  }

  function el(tag, props = {}, text = '') {
    const node = Object.assign(document.createElement(tag), props);
    if (text) node.textContent = text;
    return node;
  }

  const subsOf = (c) =>
    [...new Set(terms.filter((t) => t.subcategory && sameTerm(t.category || '', c)).map((t) => t.subcategory))].sort((a, b) => a.localeCompare(b));

  function fillSubs() {
    $('subcategories').replaceChildren(...subsOf($('category').value).map((s) => el('option', { value: s })));
  }

  // Returns the sub options of the active category; '' = terms with no subcategory ("عام")
  function renderSubChips() {
    const box = $('subchips');
    box.replaceChildren();
    const inCategory = terms.filter((t) => t.category === activeCategory);
    const subs = subsOf(activeCategory);
    const options = subs.length && inCategory.some((t) => !t.subcategory) ? [...subs, ''] : subs;
    if (!options.includes(activeSub)) activeSub = options[0] ?? '';
    for (const s of options) {
      const count = inCategory.filter((t) => (t.subcategory || '') === s).length;
      const chip = el('button', { type: 'button', dir: 'auto', className: 'chip' + (s === activeSub ? ' active' : '') }, `${s || 'عام'} (${count})`);
      chip.onclick = () => {
        activeSub = s;
        if (!editingId) $('subcategory').value = s;
        render();
      };
      box.append(chip);
    }
    return options;
  }

  function renderChips(categories) {
    const chips = $('chips');
    chips.replaceChildren();
    for (const c of categories) {
      // A category with subcategories counts them, otherwise it counts its terms
      const count = subsOf(c).length || terms.filter((t) => t.category === c).length;
      const chip = el('button', { type: 'button', dir: 'auto', className: 'chip' + (c === activeCategory ? ' active' : '') }, `${c} (${count})`);
      chip.onclick = () => {
        activeCategory = c;
        activeSub = '';
        if (!editingId) $('category').value = c;
        render();
        if (!editingId) $('subcategory').value = activeSub;
      };
      chips.append(chip);
    }
  }

  function render() {
    const categories = [...new Set(terms.map((t) => t.category).filter(Boolean))].sort((a, b) => a.localeCompare(b));
    if (!categories.includes(activeCategory)) activeCategory = categories[0] ?? '';
    $('categories').replaceChildren(...categories.map((c) => el('option', { value: c })));
    renderChips(categories);
    const subOptions = renderSubChips();
    fillSubs();

    // A search looks through every category, the chips filter only when the search is empty
    const q = $('search').value.trim().toLowerCase();
    const shown = terms
      .filter((t) => q || !activeCategory || t.category === activeCategory)
      .filter((t) => q || !subOptions.length || (t.subcategory || '') === activeSub)
      .filter((t) => !q || [t.term, t.category, t.subcategory, t.meaning, ...(t.interview || []).flatMap((i) => [i.q, i.qAr, i.a])].join(' ').toLowerCase().includes(q))
      .sort((a, b) => a.id - b.id);

    $('count').textContent = terms.length ? `${terms.length} مصطلح` : '';
    const list = $('list');
    list.replaceChildren();

    if (!shown.length) {
      list.append(el('p', { className: 'empty' }, terms.length ? 'مفيش نتايج.' : 'لسه مفيش مصطلحات، ضيف أول واحد.'));
      return;
    }

    for (const t of shown) {
      const card = el('details', { className: 'term' });
      const title = el('h2', { dir: 'ltr' }, t.term);
      if (t.category) title.append(el('span', { className: 'tag' }, t.subcategory ? `${t.category} › ${t.subcategory}` : t.category));
      const summary = el('summary');
      summary.append(title);
      card.append(summary, el('p', { dir: 'auto' }, t.meaning));
      if (t.code) card.append(el('pre', {}, t.code));
      if (t.interview?.length) {
        const box = el('section', { className: 'interview' });
        const head = el('div', { className: 'interview-head' });
        head.append(el('h3', {}, 'أسئلة الإنترفيو'));
        box.append(head);
        const questions = [];
        for (const item of t.interview) {
          const q = el('p', { className: 'q', dir: 'auto' }, item.qAr || item.q);
          questions.push([q, item]);
          box.append(q, el('p', { dir: 'auto' }, item.a));
          if (item.code) box.append(el('pre', {}, item.code));
        }
        // Swaps the questions between English and Arabic without re-rendering (keeps the card open)
        if (t.interview.some((i) => i.qAr)) {
          let arabic = true;
          const toggle = el('button', { type: 'button', className: 'chip' }, 'English');
          toggle.onclick = () => {
            arabic = !arabic;
            toggle.textContent = arabic ? 'English' : 'عربي';
            for (const [p, item] of questions) p.textContent = arabic ? item.qAr || item.q : item.q;
          };
          head.append(toggle);
        }
        card.append(box);
      }
      const edit = el('button', { type: 'button' }, 'تعديل');
      const del = el('button', { type: 'button', className: 'danger' }, 'حذف');
      edit.onclick = () => startEdit(t);
      del.onclick = () => confirm(`تحذف "${t.term}"؟`) && commit(`delete: ${t.term}`, (all) => all.filter((x) => x.id !== t.id));
      const actions = el('div', { className: 'row' });
      actions.append(edit, del);
      card.append(actions);
      list.append(card);
    }
  }

  function startEdit(t) {
    editingId = t.id;
    $('term').value = t.term;
    $('category').value = t.category || '';
    $('subcategory').value = t.subcategory || '';
    fillSubs();
    $('meaning').value = t.meaning;
    $('code').value = t.code || '';
    $('interview').value = formatInterview(t.interview);
    $('submit').textContent = 'حفظ التعديل';
    $('cancel').hidden = false;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    $('term').focus();
  }

  function resetForm() {
    editingId = null;
    $('form').reset();
    $('submit').textContent = 'إضافة';
    $('cancel').hidden = true;
  }

  async function load() {
    $('setup').hidden = true;
    $('app').hidden = false;
    setBusy(true, 'بيحمّل...');
    try {
      terms = (await fetchFile()).list;
      render();
    } catch (e) {
      alert(e.message);
    } finally {
      setBusy(false);
    }
  }

  function logout() {
    token = null;
    writeToken(null);
    terms = [];
    resetForm();
    $('app').hidden = true;
    $('setup').hidden = false;
  }

  $('setup').onsubmit = (e) => {
    e.preventDefault();
    token = $('token').value.trim();
    $('token').value = '';
    writeToken(token);
    load();
  };

  $('form').onsubmit = async (e) => {
    e.preventDefault();
    const entry = {
      term: $('term').value.trim(),
      category: $('category').value.trim(),
      subcategory: $('subcategory').value.trim(),
      meaning: $('meaning').value.trim(),
      code: $('code').value.trim(),
      interview: parseInterview($('interview').value),
    };
    if (!entry.term || !entry.category || !entry.meaning) return;
    const id = editingId;
    const saved = await commit(`${id ? 'edit' : 'add'}: ${entry.term}`, (all) => {
      if (all.some((t) => t.id !== id && sameTerm(t.term, entry.term))) {
        throw new Error('المصطلح ده موجود بالفعل، عدّله من القايمة.');
      }
      // Reuse an existing category's spelling so "js" and "JS" stay one chip
      entry.category = all.map((t) => t.category).find((c) => c && sameTerm(c, entry.category)) || entry.category;
      entry.subcategory = all
        .filter((t) => t.category === entry.category)
        .map((t) => t.subcategory)
        .find((s) => s && sameTerm(s, entry.subcategory)) || entry.subcategory;
      // Drop empty optional fields (no subcategory = single-level category)
      const clean = ({ subcategory, interview, ...rest }) => ({
        ...rest,
        ...(subcategory ? { subcategory } : {}),
        ...(interview.length ? { interview } : {}),
      });
      return id ? all.map((t) => (t.id === id ? clean({ ...t, ...entry }) : t)) : [...all, clean({ id: Date.now(), ...entry })];
    });
    if (!saved) return;
    activeCategory = entry.category;
    activeSub = entry.subcategory;
    resetForm();
    render();
  };

  $('cancel').onclick = resetForm;
  $('search').oninput = render;
  $('category').oninput = fillSubs;

  if (token) load();
  else $('setup').hidden = false;
</script>
</body>
</html>
